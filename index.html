<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05080e">
<meta name="color-scheme" content="dark">
<title>极简麻将 · 横竖自适应</title>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-players-hands.css">
<link rel="stylesheet" href="css/03-controls-popups.css">
<link rel="stylesheet" href="css/12-result-modal.css">
<link rel="stylesheet" href="css/13-info-overlays.css">
<link rel="stylesheet" href="css/14-compact-menus.css">
<link rel="stylesheet" href="css/15-game-feel.css">
<link rel="stylesheet" href="css/04-dice-menus.css">
<link rel="stylesheet" href="css/06-media-landscape.css">
<link rel="stylesheet" href="css/07-portrait-layout.css">
<link rel="stylesheet" href="css/08-media-portrait.css">
<link rel="stylesheet" href="css/09-ui-scale.css">
<link rel="stylesheet" href="css/10-tile-images.css">
<link rel="stylesheet" href="css/11-icons.css">
</head>
<body>


<div id="reveal-modal">
    <div class="hu-box">
        <div class="hu-title" id="reveal-title">检测到特殊牌型</div>
        <div class="hu-actions">
            <button onclick="Game.confirmReveal(true)">亮牌</button>
            <button onclick="Game.confirmReveal(false)">不亮</button>
        </div>
    </div>
</div>

<div id="mode-select-modal">
    <div class="hu-box">
        <div class="hu-title">模式选择</div>
        <div class="mode-options">
            <button type="button" class="mode-option" data-mode="daily" onclick="Game.chooseMode('daily')">
                <span class="mode-check" aria-hidden="true"></span>
                <span class="mode-text"><b>日常模式</b><i>经典玩法不变</i></span>
            </button>
            <button type="button" class="mode-option" data-mode="advanced" onclick="Game.chooseMode('advanced')">
                <span class="mode-check" aria-hidden="true"></span>
                <span class="mode-text"><b>高阶模式</b><i>自定义规则</i></span>
            </button>
        </div>
        <div class="assist-options">
            <div class="rule-row" data-assist="dangerHint"><span class="rule-name">危险提示<i>标出真会点炮的牌</i></span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setAssistYN('dangerHint',true)">是</button><button type="button" data-yn="0" onclick="Game.setAssistYN('dangerHint',false)">否</button></span></div>
            <div class="rule-row" data-assist="coachMode"><span class="rule-name">教练模式<i>AI 推荐出牌并解释</i></span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setAssistYN('coachMode',true)">是</button><button type="button" data-yn="0" onclick="Game.setAssistYN('coachMode',false)">否</button></span></div>
        </div>
    </div>
</div>

<div id="rules-modal">
    <div class="hu-box">
        <div class="hu-title">高阶规则</div>
        <div class="rules-hint">默认配置即日常玩法，逐项调整即自定义；置灰项为互斥/从属，不可选</div>
        <div class="rules-group">
            <div class="rules-group-title">胡牌要求</div>
            <div class="rule-row" data-rule="mustKaimen"><span class="rule-name">必须开门</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('mustKaimen',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('mustKaimen',false)">否</button></span></div>
            <div class="rule-row" data-rule="mustPeng"><span class="rule-name">必须有碰牌</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('mustPeng',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('mustPeng',false)">否</button></span></div>
            <div class="rule-row" data-rule="dragonsAsPeng"><span class="rule-name">中发白作将相当于碰牌</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('dragonsAsPeng',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('dragonsAsPeng',false)">否</button></span></div>
            <div class="rule-row" data-rule="mustYaojiu"><span class="rule-name">必须有幺九</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('mustYaojiu',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('mustYaojiu',false)">否</button></span></div>
            <div class="rule-row" data-rule="mustSanmenqi"><span class="rule-name">必须三门齐</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('mustSanmenqi',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('mustSanmenqi',false)">否</button></span></div>
        </div>
        <div class="rules-group">
            <div class="rules-group-title">亮牌</div>
            <div class="rule-row" data-rule="revealAllowed"><span class="rule-name">中发白东西南北可以亮牌</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('revealAllowed',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('revealAllowed',false)">否</button></span></div>
            <div class="rule-row" data-rule="revealFirstTurn"><span class="rule-name">打第一张牌前亮</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('revealFirstTurn',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('revealFirstTurn',false)">否</button></span></div>
            <div class="rule-row" data-rule="revealAnytime"><span class="rule-name">随时亮牌</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('revealAnytime',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('revealAnytime',false)">否</button></span></div>
        </div>
        <div class="rules-group">
            <div class="rules-group-title">特殊牌型</div>
            <div class="rule-row" data-rule="sevenPairs"><span class="rule-name">七小对可胡</span><span class="yn-seg"><button type="button" data-yn="1" onclick="Game.setRuleYN('sevenPairs',true)">是</button><button type="button" data-yn="0" onclick="Game.setRuleYN('sevenPairs',false)">否</button></span></div>
        </div>
        <div class="hu-actions">
            <button onclick="Game.confirmRules()">开始</button>
            <button onclick="Game.backToModeSelect()">返回</button>
        </div>
    </div>
</div>

<div id="amount-modal">
    <div class="hu-box">
        <div class="hu-title">初始筹码</div>
        <div class="result-label center">四家以此金额开场</div>
        <div class="hu-actions stack">
            <button onclick="Game.chooseAmount(50)">50</button>
            <button onclick="Game.chooseAmount(100)">100</button>
            <button onclick="Game.chooseAmount('custom')">自定义</button>
            <button onclick="Game.closeAmountModal()">取消</button>
        </div>
    </div>
</div>

<div id="bust-modal">
    <div class="bust-box">
        <div class="bust-title">筹码不足</div>
        <div class="bust-msg" id="bust-message"></div>
        <div class="bust-actions">
            <button type="button" class="bust-primary" onclick="Game.confirmBustRestart()">重新开场</button>
            <button type="button" onclick="Game.cancelBustRestart()">继续本场</button>
        </div>
    </div>
</div>

<div id="round-modal">
    <div class="hu-box">
        <div class="hu-title">调庄提醒</div>
        <div class="result-label center" id="round-message"></div>
        <div class="hu-actions">
            <button onclick="Game.confirmRoundReselect()">4圈结束调庄</button>
        </div>
    </div>
</div>

<div id="chi-choice-modal">
    <div class="hu-box">
        <div class="hu-title">选择吃法</div>
        <div class="result-label center">点选一组顺子</div>
        <div class="hu-options" id="chi-choice-options"></div>
        <div class="hu-actions">
            <button type="button" onclick="Game.closeChiChoice()">取消</button>
        </div>
    </div>
</div>

<div id="pool-modal" onclick="if(event.target.id==='pool-modal')Game.closePoolModal()">
    <div class="pool-box">
        <div class="pool-box-header">
            <span class="pool-box-title">牌池<span class="pool-box-count" id="pool-box-count"></span></span>
            <button type="button" class="pool-box-close" onclick="Game.closePoolModal()">✕</button>
        </div>
        <div id="pool-grid"></div>
    </div>
</div>


<div id="result-modal">
    <div class="result-box">
      <div class="result-scroll">
        <div class="result-title" id="result-title">东胡</div>
        <div class="result-subtitle" id="result-subtitle">自摸</div>
        <div class="result-label">手牌</div>
        <div class="result-row" id="result-concealed"></div>
        <div class="result-label">吃碰杠亮</div>
        <div class="result-row" id="result-exposed"></div>
        <div class="result-lines" id="result-score-lines"></div>
        <div class="result-total" id="result-total"></div>
        <div class="result-divider"></div>
        <div class="result-payouts" id="result-payouts"></div>
        <div id="result-adjust-panel" style="display:none;">
            <div class="result-adjust-hint">改其中一家，其余相关分数会自动联动；点「恢复系统分」可撤销</div>
            <div class="result-payouts" id="result-payouts-edit"></div>
            <div class="result-adjust-btns">
                <button type="button" onclick="Game.resetSettlementPayouts()">恢复系统分</button>
            </div>
        </div>
      </div>
        <div class="result-adjust-btns">
            <button type="button" id="btn-toggle-adjust" onclick="Game.toggleSettlementAdjust()">特殊情况：手动调分</button>
            <button type="button" onclick="Game.closeResultModal()">确定</button>
        </div>
    </div>
</div>

<div id="table-wrap">
<!-- 署名两行：内容由 js/14-credit-clock.js 生成（第一行署名，第二行时间 + 已玩时间） -->
<div id="credit-label"></div>
<div id="credit-label-2"></div>
<div id="table-frame" onclick="Game.onTableTap(event)">
<div id="table-center-prompt" aria-hidden="true"></div>
<div id="game-table">
    <div id="dice-stage">
        <div id="dice-scene">
            <div class="dice-throw" id="dice-throw-1">
                <div class="dice-shadow"></div>
                <div class="dice-cube">
                    <div class="face f1"><div class="pips" data-n="1"></div></div>
                    <div class="face f2"><div class="pips" data-n="2"></div></div>
                    <div class="face f3"><div class="pips" data-n="3"></div></div>
                    <div class="face f4"><div class="pips" data-n="4"></div></div>
                    <div class="face f5"><div class="pips" data-n="5"></div></div>
                    <div class="face f6"><div class="pips" data-n="6"></div></div>
                </div>
            </div>
            <div class="dice-throw" id="dice-throw-2">
                <div class="dice-shadow"></div>
                <div class="dice-cube">
                    <div class="face f1"><div class="pips" data-n="1"></div></div>
                    <div class="face f2"><div class="pips" data-n="2"></div></div>
                    <div class="face f3"><div class="pips" data-n="3"></div></div>
                    <div class="face f4"><div class="pips" data-n="4"></div></div>
                    <div class="face f5"><div class="pips" data-n="5"></div></div>
                    <div class="face f6"><div class="pips" data-n="6"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="player top" id="p-top">
        <div class="player-label">
            <span class="player-score" id="score-top"></span><span class="avatar" onclick="Game.toggleExposedInfo('top')"><img src="avatars/avatar-top.webp" alt="西" draggable="false"></span>
        </div>
        <div id="exposed-top" class="ai-exposed"></div>
        <div id="hand-top" class="hand"></div>
    </div>
    <div class="player left" id="p-left">
        <div class="player-side-stack">
        <div class="player-label">
            <span class="player-score" id="score-left"></span><span class="avatar" onclick="Game.toggleExposedInfo('left')"><img src="avatars/avatar-left.webp" alt="北" draggable="false"></span>
        </div>
        <div id="exposed-left" class="ai-exposed"></div>
        </div>
        <div id="hand-left" class="hand"></div>
    </div>
    <div class="player right" id="p-right">
        <div class="player-side-stack">
        <div class="player-label">
            <span class="player-score" id="score-right"></span><span class="avatar" onclick="Game.toggleExposedInfo('right')"><img src="avatars/avatar-right.webp" alt="南" draggable="false"></span>
        </div>
        <div id="exposed-right" class="ai-exposed"></div>
        </div>
        <div id="hand-right" class="hand"></div>
    </div>
    <div class="player bottom" id="p-bottom">
        <div class="player-label">
            <span class="player-score" id="score-bottom"></span>
            <span class="avatar-with-toggle">
                <button type="button" id="tenpai-hint-toggle" class="tenpai-hint-toggle" title="听牌提示开关（亮=显示）" aria-pressed="false" aria-label="听牌提示开关" onclick="event.stopPropagation();Game.toggleTenpaiHint()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="10" r="1.3" fill="currentColor"/><circle cx="16" cy="10" r="1.3" fill="currentColor"/></svg></button>
                <span class="avatar" onclick="Game.toggleExposedInfo('bottom')"><img src="avatars/avatar-bottom.webp" alt="东" draggable="false"></span>
            </span>
        </div>
        <div id="hand-bottom" class="hand" onclick="Game.handleDiscard(event)"></div>
        <div id="assist-line" aria-live="polite"></div>
        <div id="flow-log"></div>
    </div>
    <button type="button" id="discard-query-btn" title="点击查询牌池" onclick="event.stopPropagation();Game.openPoolModal()">点击查询牌池</button>
    <div id="discardWall"></div>
    <div id="tile-tooltip" aria-live="polite"></div>
<div id="wall-count">
        <div id="wall-count-header">
            <div id="wall-count-row">
                <div class="wc-row"><span id="img-display-badge" title="TP制作">TP制作</span></div>
                <div class="wc-row"><span id="wall-count-text"></span></div>
                <div class="wc-row"><button type="button" id="btn-view-zoom-in" title="放大" aria-label="放大" onclick="event.stopPropagation();Game.adjustViewSize(5)">＋</button><button type="button" id="btn-view-zoom-out" title="缩小" aria-label="缩小" onclick="event.stopPropagation();Game.adjustViewSize(-5)">－</button></div>
                <div class="wc-row"><button type="button" class="credit-btn-ls" onclick="event.stopPropagation();Game.openModeSelect()">模式选择</button>
                <button type="button" class="credit-btn-ls" onclick="event.stopPropagation();Game.openAmountSelect()">初始筹码</button></div>
                <div class="wc-row"><button type="button" class="credit-btn-ls" id="sfx-toggle-ls" onclick="event.stopPropagation();Game.toggleSfx()">音效开</button><span id="field-count-ls" class="field-rounds">1/东/1</span></div>
            </div>
        </div>
        <div id="wall-count-gap"></div>
        <div id="player-stats">
            <div class="stat-row avatar-row" id="stat-avatar"></div>
            <div class="stat-row" id="stat-wind"></div>
            <div class="stat-row" id="stat-medal"></div>
            <div class="stat-row" id="stat-dealer"></div>
            <div class="stat-row" id="stat-tenpai"></div>
        </div>
        <div id="claim-indicator"></div>
    </div>
</div>
</div>
</div>


<div id="player-intro-modal" onclick="if(event.target.id==='player-intro-modal')Game.closePlayerIntro()">
    <div class="player-intro-box" onclick="event.stopPropagation()">
        <div class="player-intro-title" id="player-intro-title"></div>
        <div class="player-intro-sub" id="player-intro-sub"></div>
        <div class="player-intro-body" id="player-intro-body"></div>
    </div>
</div>

<script src="js/01-globals-state.js"></script>
<script src="js/02-scoring.js"></script>
<script src="js/03-dice-ritual.js"></script>
<script src="js/04-view-scale.js"></script>
<script src="js/05-device-orientation.js"></script>
<script src="js/06-tiles-utils.js"></script>
<script src="js/07-hu-detection.js"></script>
<script src="js/08-game-flow-core.js"></script>
<script src="js/09-turn-settlement.js"></script>
<script src="js/10-ai-shanten-bench.js"></script>
<script src="js/11-ai-discard-claim.js"></script>
<script src="js/12-render.js"></script>
<script src="js/13-game-actions.js"></script>
<script src="js/14-credit-clock.js"></script>
<script src="js/15-stat-avatar-longpress.js"></script>
<script src="js/16-rules-config.js"></script>
<script src="js/17-field-manager.js"></script>
<script src="js/18-game-feel.js"></script>
<script src="js/19-ai-efficiency.js"></script>
<script src="js/20-ai-danger-ev.js"></script>
</body>
</html>
