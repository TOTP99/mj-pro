<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05080e">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<title>极简麻将 · 横竖自适应</title>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-players-hands.css">
<link rel="stylesheet" href="css/03-controls-popups.css">
<link rel="stylesheet" href="css/04-dice-menus.css">
<link rel="stylesheet" href="css/05-landscape-max.css">
<link rel="stylesheet" href="css/06-media-landscape.css">
<link rel="stylesheet" href="css/07-portrait-layout.css">
<link rel="stylesheet" href="css/08-media-portrait.css">
<link rel="stylesheet" href="css/09-ui-scale.css">
<link rel="stylesheet" href="css/10-tile-images.css">
<link rel="stylesheet" href="css/11-icons.css">
<link rel="stylesheet" href="css/12-game-feel.css">
<link rel="stylesheet" href="css/13-toolbar.css">
<link rel="stylesheet" href="css/14-left-panel.css">
<link rel="stylesheet" href="css/15-bust-modal.css">
<link rel="stylesheet" href="css/16-redesign.css">
</head>
<body>


<div id="reveal-modal" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
    <div class="hu-box">
        <div class="hu-title" id="reveal-title">检测到特殊牌型</div>
        <div class="hu-actions">
            <button type="button" class="btn-primary" onclick="confirmReveal(true)">亮牌</button>
            <button type="button" class="btn-ghost" onclick="confirmReveal(false)">不亮</button>
        </div>
    </div>
</div>

<div id="chi-choice-modal" role="dialog" aria-modal="true" aria-label="选择吃法">
    <div class="hu-box">
        <div class="hu-title">选择吃法</div>
        <div class="hu-scroll">
            <div class="result-label center">点选一组顺子</div>
            <div class="hu-options" id="chi-choice-options"></div>
        </div>
        <div class="hu-actions">
            <button type="button" class="btn-ghost" onclick="closeChiChoice()">取消</button>
        </div>
    </div>
</div>

<div id="bust-modal" role="dialog" aria-modal="true" aria-labelledby="bust-title">
    <div class="bust-box">
        <div class="bust-title" id="bust-title">筹码不足</div>
        <div class="bust-msg" id="bust-message"></div>
        <div class="bust-actions">
            <button type="button" class="bust-btn ghost" onclick="cancelBustRestart()">继续当前场</button>
            <button type="button" class="bust-btn primary" onclick="confirmBustRestart()">重新开场</button>
        </div>
    </div>
</div>

<div id="pool-modal" role="dialog" aria-modal="true" aria-label="牌池" onclick="if(event.target.id==='pool-modal')closePoolModal()">
    <div class="pool-box">
        <div class="pool-box-header">
            <span class="pool-box-title">牌池<span class="pool-box-count" id="pool-box-count"></span></span>
            <button type="button" class="pool-box-close" onclick="closePoolModal()">✕</button>
        </div>
        <div id="pool-grid"></div>
        <div class="hu-actions" style="margin-top: 8px;">
            <button type="button" class="btn-ghost" onclick="closePoolModal()">关闭</button>
        </div>
    </div>
</div>


<div id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="result-box">
      <div class="result-scroll">
        <div class="result-title" id="result-title">东胡</div>
        <div class="result-subtitle" id="result-subtitle">自摸</div>
        <div class="result-label">手牌</div>
        <div class="result-row" id="result-concealed"></div>
        <div class="result-label">吃碰杠亮</div>
        <div class="result-row" id="result-exposed"></div>
        <div class="result-lines" id="result-score-lines"></div>
        <div class="result-total" id="result-total"></div>
        <div class="result-divider"></div>
        <div class="result-payouts" id="result-payouts"></div>
        <div id="result-adjust-panel" style="display:none;">
            <div class="result-adjust-hint">改其中一家，其余相关分数会自动联动；点「恢复系统分」可撤销</div>
            <div id="result-payouts-edit"></div>
            <div class="result-adjust-btns">
                <button type="button" onclick="resetSettlementPayouts()">恢复系统分</button>
            </div>
        </div>
      </div>
        <div class="result-adjust-btns">
            <button type="button" id="btn-toggle-adjust" onclick="toggleSettlementAdjust()">特殊情况：手动调分</button>
            <button type="button" onclick="closeResultModal()">确定</button>
        </div>
    </div>
</div>

<div id="table-wrap">
<!-- 署名两行：内容由 js/14-credit-clock.js 生成（第一行署名，第二行时间 + 已玩时间） -->
<div id="credit-label"></div>
<div id="credit-label-2"></div>
<div id="credit-corner">TP制作➸369❖❁</div>
<div id="table-frame" onclick="onTableTap(event)">
<div id="game-table">
    <div id="dice-stage">
        <div id="dice-scene">
            <!-- 单颗八面 d8：由 03-dice-ritual-3.js 在 canvas 上绘制 -->
            <canvas id="dice-canvas"></canvas>
        </div>
    </div>
    <div class="player top" id="p-top">
        <div class="player-label">
            <span class="player-score" id="score-top"></span><span class="avatar" onclick="toggleExposedInfo('top')"><img src="avatars/avatar-top.webp" alt="西" draggable="false"></span>
        </div>
        <div id="exposed-top" class="ai-exposed"></div>
        <div id="hand-top" class="hand"></div>
    </div>
    <div class="player left" id="p-left">
        <div class="player-side-stack">
        <div class="player-label">
            <span class="player-score" id="score-left"></span><span class="avatar" onclick="toggleExposedInfo('left')"><img src="avatars/avatar-left.webp" alt="北" draggable="false"></span>
        </div>
        <div id="exposed-left" class="ai-exposed"></div>
        </div>
        <div id="hand-left" class="hand"></div>
    </div>
    <div class="player right" id="p-right">
        <div class="player-side-stack">
        <div class="player-label">
            <span class="player-score" id="score-right"></span><span class="avatar" onclick="toggleExposedInfo('right')"><img src="avatars/avatar-right.webp" alt="南" draggable="false"></span>
        </div>
        <div id="exposed-right" class="ai-exposed"></div>
        </div>
        <div id="hand-right" class="hand"></div>
    </div>
    <div class="player bottom" id="p-bottom">
        <div class="player-label">
            <span class="player-score" id="score-bottom"></span>
            <span class="avatar-with-toggle">
                <button type="button" id="tenpai-hint-toggle" class="tenpai-hint-toggle" title="听牌提示开关（亮=显示）" aria-pressed="false" aria-label="听牌提示开关" onclick="event.stopPropagation();toggleTenpaiHint()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="10" r="1.3" fill="currentColor"/><circle cx="16" cy="10" r="1.3" fill="currentColor"/></svg></button>
                <span class="avatar" onclick="toggleExposedInfo('bottom')"><img src="avatars/avatar-bottom.webp" alt="东" draggable="false"></span>
            </span>
        </div>
        <div id="hand-bottom" class="hand" onclick="handleDiscard(event)"></div>
        <div id="flow-log"></div>
    </div>
    <button type="button" id="discard-query-btn" title="点击查询牌池" onclick="event.stopPropagation();openPoolModal()">点击查询牌池</button>
    <div id="discardWall"></div>
    <div id="tile-tooltip" aria-live="polite"></div>
<div id="wall-count">
        <div id="wall-count-header">
            <div id="wall-count-row">
                <span id="img-display-badge" title="TP制作">TP制作</span>
                <span id="wall-count-text"></span>
                <button type="button" id="btn-view-zoom-in" title="放大" aria-label="放大" onclick="event.stopPropagation();adjustViewScale(0.05)">＋</button>
                <button type="button" id="btn-view-zoom-out" title="缩小" aria-label="缩小" onclick="event.stopPropagation();adjustViewScale(-0.05)">－</button>
            </div>
        </div>
        <div id="wall-count-gap"></div>
        <div id="player-stats">
            <div class="stat-row avatar-row" id="stat-avatar"></div>
            <div class="stat-row" id="stat-wind"></div>
            <div class="stat-row" id="stat-medal"></div>
            <div class="stat-row" id="stat-dealer"></div>
            <div class="stat-row" id="stat-tenpai"></div>
        </div>
        <div id="claim-indicator"></div>
    </div>
</div>
</div>
</div>


<div id="player-intro-modal" onclick="if(event.target.id==='player-intro-modal')closePlayerIntro()">
    <div class="player-intro-box" onclick="event.stopPropagation()">
        <div class="player-intro-title" id="player-intro-title"></div>
        <div class="player-intro-sub" id="player-intro-sub"></div>
        <div class="player-intro-body" id="player-intro-body"></div>
    </div>
</div>

<script src="js/00-ai-preseed.js"></script>
<script src="js/01-globals-state.js"></script>
<script src="js/02-scoring.js"></script>
<script src="js/03-dice-ritual.js"></script>
<script src="js/04-view-scale.js"></script>
<script src="js/05-device-orientation.js"></script>
<script src="js/06-tiles-utils.js"></script>
<script src="js/07-hu-detection.js"></script>
<script src="js/08-game-flow-core.js"></script>
<script src="js/09-turn-settlement.js"></script>
<script src="js/10-ai-shanten.js"></script>
<script src="js/11-ai-discard.js"></script>
<script src="js/11-ai-claim.js"></script>
<script src="js/12-render.js"></script>
<script src="js/13-game-actions.js"></script>
<script src="js/14-credit-clock.js"></script>
<script src="js/15-stat-avatar-longpress.js"></script>
<script src="js/16-game-feel.js"></script>
<script src="js/17-toolbar.js"></script>
<script src="js/18-bust-restart.js"></script>
</body>
</html>
